name: release

# Push a tag like v0.6.2 → run the full test suite, then build the Windows
# desktop installer (Tauri/MSVC) and the Linux packages (.deb, .rpm, .AppImage)
# and publish them to a GitHub Release. Version comes from the tag. Once
# published, the Android APK of the native app is built and attached too
# (android.yml) — after, so it can never block desktop.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release and upload assets

jobs:
  # Reuse the existing suite (backend Vitest + e2e Playwright) as a gate.
  test:
    uses: ./.github/workflows/tests.yml

  # Create ONE draft Release for the tag; the build job attaches its asset.
  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Un tag SUFFIXÉ (ex. v0.7.7-rc.1) ouvre un canal de PRÉ-RELEASE : la release
      # GitHub porte le drapeau `prerelease`, donc elle est EXCLUE de
      # /releases/latest — l'endpoint que interroge l'auto-updater. Les postes en
      # production ne la voient pas, ce qui permet d'éprouver un build complet
      # (installeur signé + latest.json) sans risque, puis de promouvoir la release
      # en décochant « pre-release » si tout est bon.
      #
      # Le suffixe n'est PAS répercuté dans les fichiers de version : ils gardent un
      # semver propre (0.7.7). L'installeur porte donc la vraie version, et on évite
      # tout souci de bundler Windows avec un numéro de version pré-release.
      # Le déclencheur `tags: ["v*"]` accepte n'importe quoi (v2, vfoo, v1.2…).
      # Depuis la 1.0.0 le projet suit strictement le SemVer : on refuse ici tout
      # tag qui n'en respecte pas la grammaire, AVANT de construire quoi que ce
      # soit. Un numéro mal formé se propagerait sinon jusqu'à l'installeur et à
      # `latest.json`, où il fausserait la comparaison de versions de l'updater.
      - name: Valider le format du tag (SemVer strict)
        shell: bash
        run: |
          T="$GITHUB_REF_NAME"
          RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$T" =~ $RE ]]; then
            echo "::error::Tag '$T' invalide. Attendu : vMAJEUR.MINEUR.CORRECTIF"
            echo "::error::(suffixe de pré-release optionnel, ex. v1.0.0 ou v1.0.0-rc.1)"
            exit 1
          fi
      - id: ver
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          echo "version=${RAW%%-*}" >> "$GITHUB_OUTPUT"
          case "$RAW" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      # Fail fast if the committed version files disagree with the tag. These
      # files are the source of truth, bumped before tagging. (Mobile is now
      # PWA-only — mobile/package.json + mobile/app.json are no longer built or
      # validated here.)
      - name: Validate versions match the tag
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          fail=0
          chk() { [ "$2" = "$V" ] || { echo "::error::$1 = '$2', expected '$V'"; fail=1; }; }
          chk "web/package.json"             "$(jq -r .version web/package.json)"
          chk "tauri.conf.json"              "$(jq -r .version web/src-tauri/tauri.conf.json)"
          chk "Cargo.toml" "$(grep -m1 '^version *= *"' web/src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          [ "$fail" = 0 ] || { echo "Bump the 3 web/desktop version files to $V before tagging."; exit 1; }
      - id: create
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true

  # Windows installer via the official Tauri action (MSVC toolchain).
  desktop:
    needs: [test, release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: web/src-tauri
      - run: npm ci
        working-directory: web
      # NOTE: VITE_API_URL is deliberately NOT set → the desktop build ships
      # with NO baked server (web/src/api.js prod default is ""). tauri-action
      # runs beforeBuildCommand (npm run build), bundles the NSIS installer, and
      # uploads Chat_<version>_x64-setup.exe to the draft release.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: with createUpdaterArtifacts=true, Tauri signs the
          # installer and tauri-action generates + uploads latest.json (the
          # updater endpoint). These secrets MUST be set in the repo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: web
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.release.outputs.id }}

  # Paquets Linux : .deb (Debian, Ubuntu, Mint…), .rpm (Fedora, RHEL, openSUSE…)
  # et .AppImage (toute autre distribution, Arch compris). Chacun est signé et
  # ajouté à latest.json sous sa propre clé (linux-x86_64-deb, -rpm, -appimage) :
  # l'updater lit le type de paquet inscrit dans le binaire par le bundler, donc
  # un poste installé par .deb se met à jour par .deb (pkexec dpkg -i), par .rpm
  # avec rpm -U, et une AppImage se remplace elle-même.
  #
  # APRÈS `desktop`, pas en parallèle : tauri-action complète latest.json en le
  # relisant, en y ajoutant ses plateformes puis en supprimant et renvoyant le
  # fichier. Deux jobs en même temps pourraient s'écraser l'un l'autre, et
  # l'updater perdrait Windows ou Linux.
  #
  # Ubuntu 22.04 et non ubuntu-latest : un binaire exige la glibc de la machine
  # qui l'a construit, au minimum. Celle de la 22.04 (2.35) garde installables
  # Debian 12+, Ubuntu 22.04+, Mint 21+ et Fedora 37+. Construire sur une Ubuntu
  # plus récente exclurait ces versions.
  linux:
    needs: [release, desktop]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # WebKitGTK 4.1 (le webview), ayatana-appindicator (le tray, aussi copié dans
      # l'AppImage et déclaré en dépendance des paquets), librsvg, xdo (menus).
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: web/src-tauri
      - run: npm ci
        working-directory: web
      # Même build que Windows (aucun serveur figé, VITE_API_URL absent), mêmes
      # clés de signature de l'updater.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: web
          args: --bundles deb,rpm,appimage
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.release.outputs.id }}

  # Flip the draft to a published release once the installers are attached.
  publish:
    needs: [desktop, linux, release]
    runs-on: ubuntu-latest
    steps:
      # latest.json est ce que lit l'auto-updater : avant de publier, on vérifie
      # qu'il annonce bien cette version, signée, pour chaque type de poste. Un
      # job desktop ou linux qui aurait perdu l'écriture de l'autre se voit ici,
      # tant que la release est encore un brouillon.
      - name: Vérifier latest.json (Windows et Linux)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.release.outputs.id }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          R="repos/$GITHUB_REPOSITORY/releases"
          AID=$(gh api "$R/$ID/assets?per_page=100" --jq '.[] | select(.name == "latest.json") | .id')
          [ -n "$AID" ] || { echo "::error::latest.json absent de la release $ID."; exit 1; }
          gh api -H "Accept: application/octet-stream" "$R/assets/$AID" > latest.json
          V=$(jq -r .version latest.json)
          [ "$V" = "$VERSION" ] || { echo "::error::latest.json annonce '$V', attendu '$VERSION'."; exit 1; }
          fail=0
          for k in windows-x86_64 windows-x86_64-nsis linux-x86_64 linux-x86_64-deb linux-x86_64-rpm linux-x86_64-appimage; do
            if jq -e --arg k "$k" '.platforms[$k] | (.url // "") != "" and (.signature // "") != ""' latest.json >/dev/null; then
              echo "$k : $(jq -r --arg k "$k" '.platforms[$k].url' latest.json)"
            else
              echo "::error::latest.json : plateforme '$k' absente ou sans signature."
              fail=1
            fi
          done
          [ "$fail" = 0 ]
      # Un PATCH minimal (`draft=false`) plutôt que softprops/action-gh-release.
      # Face à un brouillon existant, l'action réécrit d'abord TOUTE la release
      # (tag_name, target_commitish, name, body, prerelease…), puis la publie
      # par ce même PATCH minimal ; un 5xx sur la réécriture l'arrête net, sans
      # nouvel essai. Pour la v1.6.2, GitHub a répondu 500 à cette réécriture
      # (job relancé compris) comme à `gh release edit`, qui renvoie lui aussi
      # tag_name et prerelease ; le seul `draft=false` est passé d'emblée.
      #
      # Le drapeau `prerelease` n'est donc PAS renvoyé : le job `release` l'a
      # posé sur le brouillon, et un PATCH laisse intacts les champs omis. On
      # vérifie qu'il correspond au tag AVANT de publier : sans lui, une
      # pré-release deviendrait la « latest » et serait proposée à tous les
      # postes installés — exactement ce que ce canal cherche à éviter. Après
      # publication, on contrôle ce que lit l'auto-updater (/releases/latest).
      # Relancer le job est sans risque : une release déjà publiée n'est que
      # revérifiée.
      - name: Publier la release (sortie du brouillon)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.release.outputs.id }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          : "${ID:?id de la release absent (job release)}"
          R="repos/$GITHUB_REPOSITORY/releases"
          # Un 5xx passager de l'API ne doit pas laisser la release en brouillon.
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              [ "$i" = 3 ] || { echo "Essai $i/3 en échec, nouvel essai dans $((15 * i)) s" >&2; sleep $((15 * i)); }
            done
            return 1
          }
          etat() { gh api "$R/$ID" --jq '"\(.draft) \(.prerelease)"'; }
          latest() { gh api "$R/latest" --jq .tag_name; }

          S=$(retry etat)
          read -r DRAFT PRE <<< "$S"
          if [ "$PRE" != "$PRERELEASE" ]; then
            echo "::error::Release $ID ($GITHUB_REF_NAME) : prerelease=$PRE, attendu $PRERELEASE. Publication refusée."
            exit 1
          fi
          if [ "$DRAFT" = true ]; then
            retry gh api -X PATCH "$R/$ID" -F draft=false --jq '"Publiée : \(.html_url)"' \
              || { echo "::error::Impossible de sortir la release $ID du brouillon."; exit 1; }
          else
            echo "$GITHUB_REF_NAME est déjà publiée : simple vérification."
          fi

          verifier() {
            [ "$(etat)" = "false $PRERELEASE" ] || return 1
            L=$(latest) || return 1
            if [ "$PRERELEASE" = true ]; then [ "$L" != "$GITHUB_REF_NAME" ]; else [ "$L" = "$GITHUB_REF_NAME" ]; fi
          }
          if ! retry verifier; then
            echo "::error::Contrôle final en échec pour $GITHUB_REF_NAME : (draft prerelease) = $(etat), « latest » = $(latest)."
            exit 1
          fi
          echo "« latest » : $L"

  # APK Android de l'appli native (voir android.yml), attachée à la release APRÈS
  # sa publication : un échec du build Android ne retient jamais l'installeur
  # Windows ni l'auto-update desktop. Relancer ce job suffit à la rattacher.
  android:
    needs: publish
    uses: ./.github/workflows/android.yml
    with:
      tag: ${{ github.ref_name }}
    # Uniquement ce que le build Android utilise (signature, FCM), jamais `inherit`.
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
