name: release

# Push a tag like v0.6.2 → a draft GitHub Release is created at once, then IN
# PARALLEL: the full test suite, the Windows installer + Linux packages
# (desktop-build.yml) and the Android APK (android.yml). `publish` waits for the
# tests and the desktop builds only, writes latest.json and publishes. Version
# comes from the tag.
#
# Une release dont les tests échouent reste un brouillon (installeurs attachés,
# invisible des postes) : la supprimer, corriger, et taguer la version suivante.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release and upload assets

jobs:
  # Reuse the existing suite (backend Vitest + e2e Playwright) as a gate.
  test:
    uses: ./.github/workflows/tests.yml

  # Create ONE draft Release for the tag; the build jobs attach their assets.
  # Sans attendre les tests : un brouillon n'est vu par aucun poste.
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Un tag SUFFIXÉ (ex. v0.7.7-rc.1) ouvre un canal de PRÉ-RELEASE : la release
      # GitHub porte le drapeau `prerelease`, donc elle est EXCLUE de
      # /releases/latest — l'endpoint que interroge l'auto-updater. Les postes en
      # production ne la voient pas, ce qui permet d'éprouver un build complet
      # (installeur signé + latest.json) sans risque, puis de promouvoir la release
      # en décochant « pre-release » si tout est bon.
      #
      # Le suffixe n'est PAS répercuté dans les fichiers de version : ils gardent un
      # semver propre (0.7.7). L'installeur porte donc la vraie version, et on évite
      # tout souci de bundler Windows avec un numéro de version pré-release.
      # Le déclencheur `tags: ["v*"]` accepte n'importe quoi (v2, vfoo, v1.2…).
      # Depuis la 1.0.0 le projet suit strictement le SemVer : on refuse ici tout
      # tag qui n'en respecte pas la grammaire, AVANT de construire quoi que ce
      # soit. Un numéro mal formé se propagerait sinon jusqu'à l'installeur et à
      # `latest.json`, où il fausserait la comparaison de versions de l'updater.
      - name: Valider le format du tag (SemVer strict)
        shell: bash
        run: |
          T="$GITHUB_REF_NAME"
          RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$T" =~ $RE ]]; then
            echo "::error::Tag '$T' invalide. Attendu : vMAJEUR.MINEUR.CORRECTIF"
            echo "::error::(suffixe de pré-release optionnel, ex. v1.0.0 ou v1.0.0-rc.1)"
            exit 1
          fi
      - id: ver
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          echo "version=${RAW%%-*}" >> "$GITHUB_OUTPUT"
          case "$RAW" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      # Fail fast if the committed version files disagree with the tag. These
      # files are the source of truth, bumped before tagging. (Mobile is now
      # PWA-only — mobile/package.json + mobile/app.json are no longer built or
      # validated here.)
      - name: Validate versions match the tag
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          fail=0
          chk() { [ "$2" = "$V" ] || { echo "::error::$1 = '$2', expected '$V'"; fail=1; }; }
          chk "web/package.json"             "$(jq -r .version web/package.json)"
          chk "tauri.conf.json"              "$(jq -r .version web/src-tauri/tauri.conf.json)"
          chk "Cargo.toml" "$(grep -m1 '^version *= *"' web/src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          [ "$fail" = 0 ] || { echo "Bump the 3 web/desktop version files to $V before tagging."; exit 1; }
      - id: create
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true

  # Windows (NSIS) et Linux (.deb, .rpm, .AppImage) EN PARALLÈLE, et en même
  # temps que les tests (desktop-build.yml) : seule la publication attend les
  # tests. Chaque installeur est signé et envoyé sur le brouillon avec sa .sig ;
  # latest.json est composé ensuite, une seule fois, par `publish`.
  desktop:
    needs: release
    uses: ./.github/workflows/desktop-build.yml
    with:
      tag: ${{ github.ref_name }}
      release-id: ${{ needs.release.outputs.id }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # APK Android de l'appli native (voir android.yml), en parallèle elle aussi.
  # `publish` ne l'attend pas : un échec du build Android ne retient jamais
  # l'installeur Windows ni l'auto-update desktop. Si elle finit après la
  # publication, elle s'attache à la release publiée. Relancer ce job suffit.
  android:
    needs: release
    uses: ./.github/workflows/android.yml
    with:
      tag: ${{ github.ref_name }}
    # Uniquement ce que le build Android utilise (signature, FCM), jamais `inherit`.
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

  # Flip the draft to a published release once the installers are attached.
  publish:
    needs: [test, release, desktop]
    runs-on: ubuntu-latest
    steps:
      # latest.json, ce que lit l'auto-updater, composé ici une seule fois à partir
      # des installeurs et de leurs .sig (même format que tauri-action) : URL d'API
      # de l'asset, que l'updater télécharge en application/octet-stream, et
      # contenu de la signature. Chaque paquet a sa clé ; linux-x86_64 (sans type)
      # sert aux updaters qui ne connaissent pas leur type de paquet : l'AppImage,
      # comme le faisait tauri-action. Seulement tant que c'est un brouillon : une
      # release déjà publiée (job relancé) n'est que revérifiée.
      - name: Composer latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.release.outputs.id }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          R="repos/$GITHUB_REPOSITORY/releases"
          if [ "$(gh api "$R/$ID" --jq .draft)" != true ]; then
            echo "Release déjà publiée : latest.json n'est pas réécrit."; exit 0
          fi
          gh api "$R/$ID/assets?per_page=100" > assets.json
          id_of() { jq -r --arg n "$1" '.[] | select(.name == $n) | .id' assets.json; }
          # Entrée d'un paquet : le seul asset qui finit par ce suffixe, et sa .sig.
          # (`|| return 1` partout : set -e ne s'applique pas dans un $(…).)
          entry() {
            local name sig_id sig
            name=$(jq -r --arg s "$1" '[.[] | select(.name | endswith($s))] | if length == 1 then .[0].name else error("\(length) assets en \($s)") end' assets.json) || return 1
            sig_id=$(id_of "$name.sig")
            [ -n "$sig_id" ] || { echo "::error::$name.sig absent de la release" >&2; return 1; }
            sig=$(gh api -H 'Accept: application/octet-stream' "$R/assets/$sig_id") || return 1
            jq -n --arg url "https://api.github.com/$R/assets/$(id_of "$name")" --arg sig "$sig" \
                  '{signature: $sig, url: $url}'
          }
          WIN=$(entry "_x64-setup.exe")
          DEB=$(entry "_amd64.deb")
          RPM=$(entry ".x86_64.rpm")
          APP=$(entry "_amd64.AppImage")
          jq -n --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson win "$WIN" --argjson deb "$DEB" --argjson rpm "$RPM" --argjson app "$APP" \
            '{version: $v, notes: "", pub_date: $date, platforms: {
               "windows-x86_64": $win, "windows-x86_64-nsis": $win,
               "linux-x86_64": $app, "linux-x86_64-appimage": $app,
               "linux-x86_64-deb": $deb, "linux-x86_64-rpm": $rpm}}' > latest.json
          OLD=$(id_of latest.json)
          [ -z "$OLD" ] || gh api -X DELETE "$R/assets/$OLD"
          gh api -X POST "https://uploads.github.com/$R/$ID/assets?name=latest.json" \
            -H "Content-Type: application/json" --input latest.json --jq '"Envoyé : \(.name) (\(.size) octets)"'
      # Avant de publier, relire latest.json tel que les postes le liront : il doit
      # annoncer cette version, signée, pour chaque type de poste.
      - name: Vérifier latest.json (Windows et Linux)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.release.outputs.id }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          R="repos/$GITHUB_REPOSITORY/releases"
          AID=$(gh api "$R/$ID/assets?per_page=100" --jq '.[] | select(.name == "latest.json") | .id')
          [ -n "$AID" ] || { echo "::error::latest.json absent de la release $ID."; exit 1; }
          gh api -H "Accept: application/octet-stream" "$R/assets/$AID" > latest.json
          V=$(jq -r .version latest.json)
          [ "$V" = "$VERSION" ] || { echo "::error::latest.json annonce '$V', attendu '$VERSION'."; exit 1; }
          fail=0
          for k in windows-x86_64 windows-x86_64-nsis linux-x86_64 linux-x86_64-deb linux-x86_64-rpm linux-x86_64-appimage; do
            if jq -e --arg k "$k" '.platforms[$k] | (.url // "") != "" and (.signature // "") != ""' latest.json >/dev/null; then
              echo "$k : $(jq -r --arg k "$k" '.platforms[$k].url' latest.json)"
            else
              echo "::error::latest.json : plateforme '$k' absente ou sans signature."
              fail=1
            fi
          done
          [ "$fail" = 0 ]
      # Un PATCH minimal (`draft=false`) plutôt que softprops/action-gh-release.
      # Face à un brouillon existant, l'action réécrit d'abord TOUTE la release
      # (tag_name, target_commitish, name, body, prerelease…), puis la publie
      # par ce même PATCH minimal ; un 5xx sur la réécriture l'arrête net, sans
      # nouvel essai. Pour la v1.6.2, GitHub a répondu 500 à cette réécriture
      # (job relancé compris) comme à `gh release edit`, qui renvoie lui aussi
      # tag_name et prerelease ; le seul `draft=false` est passé d'emblée.
      #
      # Le drapeau `prerelease` n'est donc PAS renvoyé : le job `release` l'a
      # posé sur le brouillon, et un PATCH laisse intacts les champs omis. On
      # vérifie qu'il correspond au tag AVANT de publier : sans lui, une
      # pré-release deviendrait la « latest » et serait proposée à tous les
      # postes installés — exactement ce que ce canal cherche à éviter. Après
      # publication, on contrôle ce que lit l'auto-updater (/releases/latest).
      # Relancer le job est sans risque : une release déjà publiée n'est que
      # revérifiée.
      - name: Publier la release (sortie du brouillon)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.release.outputs.id }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          : "${ID:?id de la release absent (job release)}"
          R="repos/$GITHUB_REPOSITORY/releases"
          # Un 5xx passager de l'API ne doit pas laisser la release en brouillon.
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              [ "$i" = 3 ] || { echo "Essai $i/3 en échec, nouvel essai dans $((15 * i)) s" >&2; sleep $((15 * i)); }
            done
            return 1
          }
          etat() { gh api "$R/$ID" --jq '"\(.draft) \(.prerelease)"'; }
          latest() { gh api "$R/latest" --jq .tag_name; }

          S=$(retry etat)
          read -r DRAFT PRE <<< "$S"
          if [ "$PRE" != "$PRERELEASE" ]; then
            echo "::error::Release $ID ($GITHUB_REF_NAME) : prerelease=$PRE, attendu $PRERELEASE. Publication refusée."
            exit 1
          fi
          if [ "$DRAFT" = true ]; then
            retry gh api -X PATCH "$R/$ID" -F draft=false --jq '"Publiée : \(.html_url)"' \
              || { echo "::error::Impossible de sortir la release $ID du brouillon."; exit 1; }
          else
            echo "$GITHUB_REF_NAME est déjà publiée : simple vérification."
          fi

          verifier() {
            [ "$(etat)" = "false $PRERELEASE" ] || return 1
            L=$(latest) || return 1
            if [ "$PRERELEASE" = true ]; then [ "$L" != "$GITHUB_REF_NAME" ]; else [ "$L" = "$GITHUB_REF_NAME" ]; fi
          }
          if ! retry verifier; then
            echo "::error::Contrôle final en échec pour $GITHUB_REF_NAME : (draft prerelease) = $(etat), « latest » = $(latest)."
            exit 1
          fi
          echo "« latest » : $L"
