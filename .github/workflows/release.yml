name: release

# Push a tag like v0.6.2 → run the full test suite, then build the Windows
# desktop installer (Tauri/MSVC) and publish it to a GitHub Release. Version
# comes from the tag. Mobile is PWA-only now — no APK is built here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release and upload assets

jobs:
  # Reuse the existing suite (backend Vitest + e2e Playwright) as a gate.
  test:
    uses: ./.github/workflows/tests.yml

  # Create ONE draft Release for the tag; the build job attaches its asset.
  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Un tag SUFFIXÉ (ex. v0.7.7-rc.1) ouvre un canal de PRÉ-RELEASE : la release
      # GitHub porte le drapeau `prerelease`, donc elle est EXCLUE de
      # /releases/latest — l'endpoint que interroge l'auto-updater. Les postes en
      # production ne la voient pas, ce qui permet d'éprouver un build complet
      # (installeur signé + latest.json) sans risque, puis de promouvoir la release
      # en décochant « pre-release » si tout est bon.
      #
      # Le suffixe n'est PAS répercuté dans les fichiers de version : ils gardent un
      # semver propre (0.7.7). L'installeur porte donc la vraie version, et on évite
      # tout souci de bundler Windows avec un numéro de version pré-release.
      # Le déclencheur `tags: ["v*"]` accepte n'importe quoi (v2, vfoo, v1.2…).
      # Depuis la 1.0.0 le projet suit strictement le SemVer : on refuse ici tout
      # tag qui n'en respecte pas la grammaire, AVANT de construire quoi que ce
      # soit. Un numéro mal formé se propagerait sinon jusqu'à l'installeur et à
      # `latest.json`, où il fausserait la comparaison de versions de l'updater.
      - name: Valider le format du tag (SemVer strict)
        shell: bash
        run: |
          T="$GITHUB_REF_NAME"
          RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$T" =~ $RE ]]; then
            echo "::error::Tag '$T' invalide. Attendu : vMAJEUR.MINEUR.CORRECTIF"
            echo "::error::(suffixe de pré-release optionnel, ex. v1.0.0 ou v1.0.0-rc.1)"
            exit 1
          fi
      - id: ver
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          echo "version=${RAW%%-*}" >> "$GITHUB_OUTPUT"
          case "$RAW" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      # Fail fast if the committed version files disagree with the tag. These
      # files are the source of truth, bumped before tagging. (Mobile is now
      # PWA-only — mobile/package.json + mobile/app.json are no longer built or
      # validated here.)
      - name: Validate versions match the tag
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          fail=0
          chk() { [ "$2" = "$V" ] || { echo "::error::$1 = '$2', expected '$V'"; fail=1; }; }
          chk "web/package.json"             "$(jq -r .version web/package.json)"
          chk "tauri.conf.json"              "$(jq -r .version web/src-tauri/tauri.conf.json)"
          chk "Cargo.toml" "$(grep -m1 '^version *= *"' web/src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          [ "$fail" = 0 ] || { echo "Bump the 3 web/desktop version files to $V before tagging."; exit 1; }
      - id: create
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true

  # Windows installer via the official Tauri action (MSVC toolchain).
  desktop:
    needs: [test, release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: web/src-tauri
      - run: npm ci
        working-directory: web
      # NOTE: VITE_API_URL is deliberately NOT set → the desktop build ships
      # with NO baked server (web/src/api.js prod default is ""). tauri-action
      # runs beforeBuildCommand (npm run build), bundles the NSIS installer, and
      # uploads Chat_<version>_x64-setup.exe to the draft release.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: with createUpdaterArtifacts=true, Tauri signs the
          # installer and tauri-action generates + uploads latest.json (the
          # updater endpoint). These secrets MUST be set in the repo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: web
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.release.outputs.id }}

  # Flip the draft to a published release once the installer is attached.
  publish:
    needs: [desktop, release]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          # Conserve le drapeau au moment où l'on sort du brouillon : sans lui, une
          # pré-release deviendrait la « latest » et serait proposée à tous les
          # postes installés — exactement ce que ce canal cherche à éviter.
          prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
