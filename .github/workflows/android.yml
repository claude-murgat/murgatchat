name: android

# APK Android de l'appli native (mobile/, Expo 51). Ses fonctionnalités sont gelées
# depuis le passage à la PWA, et #75 avait retiré ce build de la release ; mais elle
# est encore installée chez certains : sans nouvelle APK, ils gardaient l'icône
# Expo par défaut et un bandeau « Nouvelle version disponible » sans rien à
# installer (l'appli compare sa version à celle du serveur).
#
# - pull_request touchant mobile/ : construit l'APK, en artefact du run (contrôle) ;
# - release.yml (workflow_call), en parallèle des builds desktop : l'APK signée et
#   son manifeste android.json sont attachés à la release du tag. `publish` ne
#   l'attend pas : un échec du build Android ne retient jamais l'installeur Windows
#   ni l'auto-update desktop. Relancer le job suffit ;
# - à la main (workflow_dispatch) : reconstruire l'APK depuis la branche choisie et
#   l'attacher à une release existante ;
# - sur main (push touchant mobile/, et chaque vendredi) : écrire le cache Gradle et
#   npm que lisent les builds des tags (un cache écrit par un tag n'est lisible que
#   par ce tag).
#
# Mise à jour in-app : l'appli lit releases/latest/download/android.json
# ({ version, versionCode, url, size, sha256, md5 }), télécharge l'APK et ouvre
# l'installeur d'Android (permission REQUEST_INSTALL_PACKAGES, contrôlée ici).
on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  schedule:
    - cron: "37 3 * * 5"
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    # Seuls les secrets dont le build a besoin, passés un par un par release.yml :
    # pas de `secrets: inherit`, qui donnerait tous les secrets du dépôt au build.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      GOOGLE_SERVICES_JSON_BASE64:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release à laquelle attacher l'APK (ex. v1.6.14)"
        required: true

permissions:
  contents: write # attacher l'APK à la release

jobs:
  apk:
    name: apk (android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 20 : la version avec laquelle le SDK Expo 51 de l'appli a été construit
      # et publié (dernière APK : 0.6.1). L'appli est gelée, son outillage aussi.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: npm ci # postinstall → patch-package
        working-directory: mobile

      # Version de l'APK = celle de la release (tag), sinon celle du web (PR).
      # versionCode monotone, même formule qu'avant #75 : 0.6.1 → 601, 1.6.14 → 10614.
      - id: vc
        shell: bash
        run: |
          if [ -n "$TAG" ]; then V="${TAG#v}"; else V="$(node -p 'require("./web/package.json").version')"; fi
          BASE="${V%%-*}" # sans le suffixe -rc.N
          IFS=. read -r MAJ MIN PAT <<< "$BASE"
          echo "code=$(( MAJ*10000 + MIN*100 + PAT ))" >> "$GITHUB_OUTPUT"
          echo "name=$V" >> "$GITHUB_OUTPUT"

      # google-services.json (FCM, notifications push) depuis un secret ; sans lui,
      # l'APK se construit sans push.
      - name: google-services.json (FCM)
        shell: bash
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > mobile/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 absent : APK sans notifications push"
          fi

      # android/ n'est pas versionné : prebuild le régénère depuis app.json (icônes,
      # écran de démarrage, icône de notification compris).
      - name: Expo prebuild (android)
        working-directory: mobile
        env:
          APP_VERSION: ${{ steps.vc.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.vc.outputs.code }}
        run: npx expo prebuild -p android --no-install

      # Cache de ~/.gradle (dépendances, wrapper, caches de build), écrit sur main
      # seulement (défaut de l'action), lu partout. `basic` : l'implémentation
      # libre sur le cache GitHub, pas le service commercial (`enhanced`, défaut).
      # Après prebuild : la clé du cache vient des fichiers Gradle qu'il génère.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Signée avec la clé d'upload des APK précédentes, sinon Android refuse de
      # l'installer par-dessus. Sans le secret (PR depuis un fork), APK signée en
      # debug : bonne pour un contrôle, jamais attachée à une release.
      - name: APK release
        shell: bash
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/upload.keystore
            # Lues par le plugin mobile/plugins/withReleaseSigning.js.
            export ORG_GRADLE_PROJECT_MURGAT_UPLOAD_STORE_FILE=upload.keystore
            export ORG_GRADLE_PROJECT_MURGAT_UPLOAD_STORE_PASSWORD="$KS_PASSWORD"
            export ORG_GRADLE_PROJECT_MURGAT_UPLOAD_KEY_ALIAS="$KEY_ALIAS"
            export ORG_GRADLE_PROJECT_MURGAT_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"
          elif [ -n "$TAG" ]; then
            echo "::error::Clé de signature absente : pas d'APK de release sans elle."; exit 1
          fi
          # Ne compiler le code natif que pour l'ARM (32 et 64 bits) : les téléphones.
          # x86/x86_64 ne servaient qu'aux émulateurs (voir aussi withArmOnly.js).
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - id: apk
        shell: bash
        working-directory: mobile/android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="Chat_${{ steps.vc.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # Aucun serveur ne doit être figé dans l'APK.
          if unzip -p "$APK" assets/app.config | grep -q '"API_URL":""'; then
            echo "app.config : API_URL vide ✓"
          else
            echo "::error::app.config : API_URL non vide, un serveur a été figé dans l'APK"; exit 1
          fi
          # Les icônes de l'appli sont bien embarquées (sinon : icône Expo par défaut).
          # En release, AGP raccourcit les chemins des fichiers (res/mipmap-…/ic_launcher.webp
          # devient res/AB.webp) : on lit donc les NOMS dans la table des ressources.
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          RES=$("$BT/aapt2" dump resources "$APK" | grep -oE '(mipmap|drawable)/(ic_launcher[a-z_]*|notification_icon|splashscreen[a-z_]*)' | sort -u) || true
          echo "$RES"
          for r in mipmap/ic_launcher_foreground drawable/notification_icon; do
            grep -qx "$r" <<< "$RES" || { echo "::error::$r absente de l'APK"; exit 1; }
          done
          # Sans cette permission, Android refuse d'ouvrir l'installeur depuis l'appli
          # et la mise à jour in-app échoue.
          "$BT/aapt2" dump permissions "$APK" | grep -q "android.permission.REQUEST_INSTALL_PACKAGES" \
            || { echo "::error::permission REQUEST_INSTALL_PACKAGES absente de l'APK"; exit 1; }
          # ARM seulement (plugin mobile/plugins/withArmOnly.js) : l'APK téléchargée par
          # la mise à jour in-app reste petite.
          ABIS=$(unzip -l "$APK" | grep -oE 'lib/[^/]+/' | sort -u | tr '\n' ' ')
          echo "ABI : $ABIS ($(( $(stat -c %s "$APK") / 1048576 )) Mo)"
          [ "$ABIS" = "lib/arm64-v8a/ lib/armeabi-v7a/ " ] \
            || { echo "::error::ABI inattendues dans l'APK : $ABIS"; exit 1; }
          # Même certificat que la dernière APK publiée (0.6.1) : sinon, l'APK ne
          # s'installe pas par-dessus et il faudrait désinstaller l'ancienne.
          if [ -f app/upload.keystore ]; then
            gh release download v0.6.1 -p 'Chat_0.6.1.apk' -D /tmp/ref --repo "$GITHUB_REPOSITORY"
            SIGNER="$BT/apksigner"
            REF=$("$SIGNER" verify --print-certs /tmp/ref/Chat_0.6.1.apk | grep 'SHA-256 digest')
            NEW=$("$SIGNER" verify --print-certs "$APK" | grep 'SHA-256 digest')
            echo "0.6.1 : $REF"; echo "nouvelle : $NEW"
            [ -n "$REF" ] && [ "$REF" = "$NEW" ] \
              || { echo "::error::certificat différent de celui de l'APK 0.6.1"; exit 1; }
          fi
          echo "path=mobile/android/$APK" >> "$GITHUB_OUTPUT"
          # Manifeste lu par l'appli pour se mettre à jour (mobile/src/version.js).
          jq -n --arg version "${{ steps.vc.outputs.name }}" --argjson versionCode "${{ steps.vc.outputs.code }}" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK" \
            --argjson size "$(stat -c %s "$APK")" \
            --arg sha256 "$(sha256sum "$APK" | cut -d' ' -f1)" --arg md5 "$(md5sum "$APK" | cut -d' ' -f1)" \
            '{version: $version, versionCode: $versionCode, url: $url, size: $size, sha256: $sha256, md5: $md5}' > android.json
          cat android.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      # APK d'abord, manifeste ensuite : l'appli ne voit jamais un android.json qui
      # pointerait vers une APK pas encore envoyée.
      - name: Attacher l'APK et android.json à la release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" mobile/android/android.json --clobber --repo "$GITHUB_REPOSITORY"
