# Étape de DÉVELOPPEMENT du pipeline de signalement (sur runner LOCAL).
# L'issue est créée déjà triée par le Claude in-app (server/src/anthropic.js +
# github.js), SANS aucun label (le gate est implicite : une issue ouverte sans
# « claude:fix » attend une validation ; aucun label à la création = aucun run
# claude-fix « skipped » parasite). Ce workflow se déclenche quand un humain
# valide en posant le tag « claude:fix » sur l'issue. Claude implémente alors un
# correctif sur une branche et OUVRE une vraie PR, puis notifie l'équipe
# directement dans le chat MurgaChat.
#
# Pourquoi un runner LOCAL (self-hosted) : le développement tourne sur ta
# machine de dev (là où l'app + le chat tournent), ce qui permet à l'étape de
# notification de joindre le serveur sur http://localhost:4000. Enregistre un
# runner self-hosted avec le label « murgatchat » (Settings → Actions → Runners),
# avec git, Node/Bun, gh, jq et curl disponibles. Voir README.
#
# NB : l'action ne crée PAS de PR toute seule (elle pousse une branche et fournit
# un lien). On demande donc explicitement `gh pr create`. La PR, ouverte via le PAT
# (secret GH_BOT_TOKEN), déclenche la CI tests.yml. Laisser la PR en attente de revue
# humaine — c'est la seule porte de validation du pipeline.
#
# L'équipe ne doit pas recevoir une PR rouge. Sur les PR #440 et #460, la CI a échoué
# sur l'e2e dès le premier commit et rien ne le signalait : le job se terminait
# à l'ouverture de la PR. Deux protections :
#   1. le prompt exige la suite e2e COMPLÈTE avant de pousser (#460 : 3 tests lancés
#      sur 51, le test cassé n'en faisait pas partie) ;
#   2. le job attend ensuite le verdict de la CI, relance Claude sur les logs si elle
#      est rouge (2 réparations au plus), et ne prévient le chat qu'à la fin.
name: claude-fix

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  # Lire le résultat et les logs de la CI de la PR (.github/scripts/wait-pr-ci.sh).
  actions: read

concurrency:
  group: claude-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.label.name == 'claude:fix'
    runs-on: [self-hosted, murgatchat]
    # Pas de plafond de tours côté Claude (cf. plus bas) : le temps de job est la
    # seule borne. On laisse de la marge pour les fix qui demandent de l'exploration,
    # puis pour la boucle CI (3 attentes de ~5 min, 2 réparations de 30 min au plus).
    timeout-minutes: 120
    env:
      # Partagé par les deux étapes de réparation. Tout ce qui varie (PR, branche,
      # logs) est dans le rapport écrit par wait-pr-ci.sh.
      CI_REPAIR_PROMPT: |
        La CI GitHub de la PR que tu as ouverte pour l'issue #${{ github.event.issue.number }} de MurgaChat
        (dépôt ${{ github.repository }}) est rouge. Travaille et rédige en français.

        Le fichier `.git/ci-failure.md` donne la PR, la branche, le commit testé, les jobs en échec et
        les logs complets. Il peut être long : cherche-y « Error », « failed » ou le nom du test.

        1. Place-toi sur la branche de la PR, à jour : `git fetch origin <branche>` puis
           `git checkout <branche>` (ou `git reset --hard origin/<branche>` si elle existe déjà ici).
        2. Trouve la vraie cause de l'échec. Un test d'un autre fichier peut casser à cause de ton
           changement : corrige alors ton code, ou adapte ce test en gardant ce qu'il vérifie.
           N'efface pas de test, ne le désactive pas (`skip`, `fixme`, `only`) et n'affaiblis pas ses
           assertions pour faire passer la CI.
        3. Reproduis et vérifie avec `.github/scripts/e2e-local.sh <chemin du spec relatif à e2e/>`,
           puis `.github/scripts/e2e-local.sh` SANS argument pour toute la suite (environ 5 minutes :
           donne à ta commande Bash un timeout de 10 minutes). Si l'échec porte sur le lint, le
           typecheck ou Vitest, rejoue la commande correspondante. Node n'est pas installé sur le
           runner : passe par un conteneur `node:24` travaillant sur une copie du dépôt.
        4. Commit sur la même branche et pousse. Pas de force-push, pas de nouvelle branche ni de
           nouvelle PR, et ne fusionne pas.
        5. Si l'échec n'a aucun rapport avec ton changement (test instable, panne d'infrastructure),
           ne pousse rien et explique-le dans un commentaire de la PR.

        RÈGLE IMPORTANTE — pas de @mention. N'écris JAMAIS « @ » suivi d'un identifiant (PR,
        commits, commentaires) : un pseudo du chat peut coïncider avec un vrai compte GitHub.
    steps:
      # Garde-fou credentials, en TOUT PREMIER pour échouer vite et clairement.
      # GH_BOT_TOKEN est un PAT : il expire. Quand il est mort, claude-code-action
      # s'arrête 4 s plus tard sur « Failed to check permissions: Bad credentials »,
      # message qui ne dit ni de quel token il s'agit, ni qu'il a expiré (vécu sur les
      # runs 33850091335 et 34097195121). On teste donc le PAT d'abord, et on écrit la
      # raison dans l'issue elle-même — via le GITHUB_TOKEN natif du workflow, seul
      # token encore valide dans ce cas — pour que la panne soit visible là où l'équipe
      # regarde, sans avoir à ouvrir les logs du job.
      - name: Vérifier le PAT GH_BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          CODE=000
          if [ -n "$BOT_TOKEN" ]; then
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $BOT_TOKEN" "https://api.github.com/repos/$REPO")
            CODE=${CODE:-000}
          fi
          if [ "$CODE" = "200" ]; then echo "✓ GH_BOT_TOKEN valide"; exit 0; fi
          if [ -z "$BOT_TOKEN" ]; then
            RAISON="le secret \`GH_BOT_TOKEN\` est absent du dépôt"
          else
            RAISON="le PAT \`GH_BOT_TOKEN\` est invalide ou expiré (l'API GitHub répond HTTP $CODE)"
          fi
          echo "::error::$RAISON — régénère-le, puis retire et repose le label claude:fix."
          # Pas de heredoc ici : son délimiteur devrait être en colonne 0, ce qui
          # sortirait du bloc littéral YAML. printf garde tout dans l'indentation.
          BODY=$(printf '%s\n' \
            "⚠️ **Le développement automatique n'a pas pu démarrer** : $RAISON." \
            "" \
            "Rien n'a été modifié sur le dépôt. Pour débloquer :" \
            "" \
            "1. Régénérer un PAT avec au minimum \`Contents: write\`, \`Pull requests: write\`, \`Issues: write\` et \`Metadata: read\` (ou le scope \`repo\` pour un token classique)." \
            "2. \`gh secret set GH_BOT_TOKEN --repo $REPO\`" \
            "3. Retirer puis reposer le label \`claude:fix\` sur cette issue.")
          gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY" \
            || echo "Commentaire d'issue impossible (non bloquant)"
          exit 1

      # Espace disque du runner, AVANT tout build. Run rouge 38916492523 : disque
      # plein pendant `docker compose up -d --build` ; le runner lui-même a planté
      # en écrivant son journal `_diag` (« No space left on device »), sans log de
      # job ni la moindre trace dans l'issue. Le runner est PERSISTANT, et rien de ce
      # qu'un run laisse derrière lui n'était jamais libéré :
      #   - les images du chat rebâties à chaque run, celles du run précédent restant
      #     orphelines, plus le cache de build Docker ;
      #   - surtout le cache de paquets de Bun : claude-code-action fait un
      #     `bun install` à chaque run, et ce cache avait atteint 6 Go — le plus gros
      #     poste, sur un disque de 32 Go partagé avec d'autres runners.
      # On purge donc ce qui est récupérable : images orphelines, cache de build
      # inutilisé depuis 3 jours (le cache récent garde les builds rapides), cache
      # Bun dès qu'il dépasse BUN_CACHE_MAX_GB ; puis, si la marge manque encore,
      # tout le cache de build et les caches Bun et npm (re-téléchargés à la
      # demande). On exige ensuite une marge avant de builder ; à défaut, échec
      # propre ET expliqué dans l'issue, comme pour le PAT.
      # Marge réglable via la variable de dépôt RUNNER_MIN_FREE_GB (un run demande
      # ~4-5 Go : images 1,6 Go, pic de build, node_modules, Playwright éventuel).
      - name: Espace disque du runner (purge Docker et caches + garde-fou)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          MIN_FREE_GB: ${{ vars.RUNNER_MIN_FREE_GB || '5' }}
          BUN_CACHE_MAX_GB: 2
        run: |
          set +e
          # Go libres sur le système de fichiers qui porte "$1" (vide si illisible).
          free_gb() { df -Pk "$1" 2>/dev/null | awk 'NR==2 {print int($4/1048576)}'; }
          # Go occupés par le dossier "$1" (0 s'il n'existe pas).
          size_gb() { du -sk "$1" 2>/dev/null | awk '{print int($1/1048576)}'; }
          # Chemin FIXE sous $HOME — pas de BUN_INSTALL_CACHE_DIR : une variable
          # vide ou mal réglée ne doit jamais pouvoir élargir la suppression.
          case "$HOME" in /?*) BUN_CACHE="$HOME/.bun/install/cache" ;; *) BUN_CACHE="" ;; esac
          # Vide le cache Bun : par Bun lui-même s'il est là, sinon ce seul dossier.
          clear_bun_cache() {
            [ -n "$BUN_CACHE" ] || return 0
            BUN_BIN=$(command -v bun || echo "$HOME/.bun/bin/bun")
            if [ -x "$BUN_BIN" ] && "$BUN_BIN" pm cache rm >/dev/null 2>&1; then return 0; fi
            rm -rf -- "$BUN_CACHE"
          }
          # Vide le cache npm : `npm cache clean`, sinon le seul dossier _cacache.
          clear_npm_cache() {
            npm cache clean --force >/dev/null 2>&1 && return 0
            case "$HOME" in /?*) rm -rf -- "$HOME/.npm/_cacache" ;; esac
          }
          DOCKER_ROOT=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null)
          # Chemins trop pleins, ou vide si la marge est partout respectée.
          low_paths() {
            LOW=""
            for P in "$GITHUB_WORKSPACE" "${DOCKER_ROOT:-/var/lib/docker}"; do
              F=$(free_gb "$P")
              [ -n "$F" ] || continue
              echo "Espace libre sur $P : ${F} Go (minimum ${MIN_FREE_GB} Go)" >&2
              [ "$F" -ge "$MIN_FREE_GB" ] || LOW="$LOW $P (${F} Go libres)"
            done
            echo "$LOW"
          }
          docker image prune -f >/dev/null
          docker builder prune -f --filter until=72h >/dev/null
          BUN_GB=$(size_gb "$BUN_CACHE")
          if [ -n "$BUN_CACHE" ] && [ "${BUN_GB:-0}" -ge "$BUN_CACHE_MAX_GB" ]; then
            echo "Cache Bun à ${BUN_GB} Go (plafond ${BUN_CACHE_MAX_GB} Go) → vidé"
            clear_bun_cache
          fi
          LOW=$(low_paths)
          if [ -n "$LOW" ]; then
            echo "Marge insuffisante après purge douce → cache de build Docker + caches Bun et npm"
            docker builder prune -af >/dev/null
            clear_bun_cache
            clear_npm_cache
            LOW=$(low_paths)
          fi
          if [ -z "$LOW" ]; then echo "✓ espace disque suffisant"; exit 0; fi
          RAISON="le disque du runner est presque plein :$LOW, il faut au moins ${MIN_FREE_GB} Go pour bâtir le chat"
          echo "::error::$RAISON — libère de l'espace sur la machine du runner, puis retire et repose le label claude:fix."
          BODY=$(printf '%s\n' \
            "⚠️ **Le développement automatique n'a pas pu démarrer** : $RAISON." \
            "" \
            "Rien n'a été modifié sur le dépôt (images Docker orphelines, cache de build Docker et caches Bun / npm déjà purgés). Pour débloquer, sur la machine du runner :" \
            "" \
            "1. Voir ce qui occupe la place : \`df -h\`, \`docker system df\`, puis \`du -sh ~/* ~/.[!.]* | sort -h\`." \
            "2. Libérer : par exemple anciennes versions du runner (\`bin.<version>\` / \`externals.<version>\` hors version courante), archive d'installation \`actions-runner-*.tar.gz\`, journaux système (\`sudo journalctl --vacuum-size=200M\`)." \
            "3. Retirer puis reposer le label \`claude:fix\` sur cette issue.")
          gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY" \
            || echo "Commentaire d'issue impossible (non bloquant)"
          exit 1

      # Outils CLI requis par le job mais pas toujours présents sur le runner :
      #   - unzip : setup-bun (dans claude-code-action) télécharge Bun en .zip ; sans
      #     unzip → « bun: command not found » / exit 127.
      #   - jq    : l'étape « Notifier MurgaChat » construit le payload JSON avec `jq -n`.
      # Best-effort et non destructif : on n'installe que ce qui manque. À défaut de
      # sudo sans mot de passe / apt-get, on échoue avec un message clair.
      - name: Prérequis runner (unzip, jq)
        run: |
          missing=""
          for c in unzip jq; do command -v "$c" >/dev/null 2>&1 || missing="$missing $c"; done
          if [ -z "$missing" ]; then echo "✓ unzip et jq présents"; exit 0; fi
          echo "Manquant(s) :$missing — tentative d'installation…"
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y $missing
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y $missing
          else
            echo "::error::Manquant(s) :$missing — installation auto impossible (sudo sans mot de passe ou apt-get requis). Installe-les sur le runner : sudo apt-get install -y$missing"
            exit 1
          fi
          for c in unzip jq; do command -v "$c" >/dev/null 2>&1 && echo "✓ $c ok"; done

      # Récupération du code à jour — checkout git MANUEL (volontairement pas
      # actions/checkout). On ramène l'arbre SUIVI sur la pointe de `main`, sans
      # jamais toucher aux fichiers non suivis/ignorés.
      #
      # POURQUOI pas actions/checkout ici (runs rouges 38228885934 puis 38253933426) :
      # le runner self-hosted est PERSISTANT, et un run précédent a laissé dans le
      # workspace des artefacts gitignorés (e2e/test-results/, …) déposés par un
      # conteneur Docker — donc propriété de ROOT. Dans prepareExistingDirectory(),
      # actions/checkout peut décider de vider le dossier de travail dès que `remove`
      # passe à true — INDÉPENDAMMENT de l'input `clean` : .git absent, URL de fetch
      # qui diffère d'un run à l'autre (persist-credentials réécrit origin),
      # sous-modules KO, ou une commande git qui throw. Il boucle alors sur les
      # fichiers et `io.rmRF` THROW sur le fichier root :
      #   « EACCES: permission denied, unlink '…/e2e/test-results/.last-run.json' »
      # → le job tombe AVANT même d'avoir commencé. `clean: false` n'y change rien
      # (vérifié), et un nettoyage amont est vain car le runner n'a PAS sudo sans mot
      # de passe : il ne peut matériellement pas supprimer ce fichier root.
      #
      # Ce checkout manuel ne fait NI `git clean` NI `rm -rf` du dossier : il ne
      # récupère que `origin/main` puis `checkout --force` + `reset --hard`, qui ne
      # concernent QUE les fichiers suivis (ceux-là appartiennent au runner → aucune
      # contrainte de permission). Les artefacts ignorés/root survivent mais, ne
      # faisant pas partie du checkout, ils ne bloquent plus rien.
      - name: Récupérer le code à jour sur main (checkout manuel résilient)
        env:
          BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          REF: main
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Autoriser git sur ce dossier même si le propriétaire diffère du user courant.
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          # URL authentifiée. x-access-token accepte un PAT classique comme jeton.
          URL="https://x-access-token:${BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Premier passage sur un workspace vierge : initialise le dépôt si besoin.
          [ -d .git ] || git init -q
          git remote set-url origin "$URL" 2>/dev/null || git remote add origin "$URL"
          # POINTE de main (comme l'ancien `ref: main`) et non le SHA de l'événement
          # « labeled » : on bâtit le chat sur le code le plus à jour.
          git fetch -q --no-tags --depth=1 origin "+refs/heads/${REF}:refs/remotes/origin/${REF}"
          # --force écrase toute modif locale sur un fichier SUIVI ; -B recale la
          # branche locale sur FETCH_HEAD ; reset --hard synchronise index + arbre.
          git checkout -q --force -B "$REF" FETCH_HEAD
          git reset -q --hard FETCH_HEAD
          echo "✓ workspace sur ${REF} @ $(git rev-parse --short HEAD)"

      # Le .env est gardé HORS du workspace (source de vérité unique sur la machine
      # du runner ; le workspace, lui, est jetable). On le recopie ici depuis la
      # source persistante avant de démarrer le chat : il surécrit le .env du run
      # précédent (fichier écrit par le runner lui-même, donc à lui et non à root).
      # Crée-le une fois :
      #   mkdir -p ~/murgatchat-secrets && cp .env.example ~/murgatchat-secrets/.env
      #   # édite les vraies valeurs, puis : chmod 600 ~/murgatchat-secrets/.env
      # Surcharge l'emplacement via la variable de dépôt RUNNER_ENV_FILE si besoin.
      - name: Injecter le .env (persistant hors workspace)
        run: |
          ENV_SRC="${{ vars.RUNNER_ENV_FILE || '~/murgatchat-secrets/.env' }}"
          ENV_SRC="${ENV_SRC/#\~/$HOME}"
          if [ ! -f "$ENV_SRC" ]; then
            echo "::error::.env introuvable à '$ENV_SRC'. Crée-le sur le runner (voir commentaire ci-dessus)."
            exit 1
          fi
          cp "$ENV_SRC" .env
          echo "✓ .env injecté depuis $ENV_SRC"

      # Le serveur n'est pas forcément déjà démarré sur la machine du runner. On
      # (re)démarre le chat avec le code à jour AVANT de coder, pour que Claude
      # puisse reproduire/tester contre l'app et que l'étape de notification finale
      # joigne le serveur sur http://localhost:4000.
      # Prérequis machine : Docker + docker compose. Le .env est injecté juste au-dessus.
      - name: Démarrer le chat en local
        run: docker compose up -d --build

      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_BOT_TOKEN }}
          # Suivi de progression SANS polluer l'issue : on n'active PAS track_progress
          # (qui posterait un commentaire de tracking sur l'issue et salit l'historique).
          # À la place :
          #   - display_report : rapport final (résumé / todos / actions) dans le
          #     « Step Summary » de l'exécution.
          #   - le détail étape par étape va dans les logs du job via l'étape
          #     « Transcription lisible de Claude » ci-dessous, qui formate
          #     l'execution_file. On N'active PAS show_full_output : il déversait le
          #     transcript en JSON brut illisible (issue #126) ET exposait des secrets.
          display_report: true
          prompt: |
            Implémente un correctif pour l'issue #${{ github.event.issue.number }} de MurgaChat
            (dépôt ${{ github.repository }}). Travaille et rédige en français.

            L'application tourne en local (API http://localhost:4000, web http://localhost:5173) :
            utilise-la pour reproduire le bug et valider ton correctif quand c'est pertinent.

            1. Lis l'issue (rapport structuré + labels posés à la création par le Claude in-app) et le code concerné.
            2. Crée une branche `claude/fix-issue-${{ github.event.issue.number }}`.
            3. Applique le correctif MINIMAL et cohérent avec le style du dépôt
               (TypeScript ESM dans server/, web/ et shared/ ; conventions existantes).
            4. Ajoute ou ajuste un test si pertinent (Vitest dans server/ ; Playwright dans e2e/).
            5. AVANT de pousser, vérifie comme le fera la CI de la PR :
               - le lint et le typecheck de chaque paquet touché (`npm run lint` et
                 `npm run typecheck` dans web/ ou server/). Node n'est pas installé sur le
                 runner : passe par un conteneur `node:24` travaillant sur une copie du dépôt,
                 pour ne pas laisser de fichiers root dans le workspace ;
               - TOUTE la suite e2e, en lançant `.github/scripts/e2e-local.sh` SANS argument
                 (stack isolée bâtie depuis tes sources, environ 5 minutes : donne à ta commande
                 Bash un timeout de 10 minutes). Ne te limite pas aux tests qui te semblent
                 concernés : un changement d'interface casse souvent un test d'un autre fichier.
                 Passer un chemin de spec ne sert qu'à itérer.
               Tout doit passer. Si ton changement casse un test existant, corrige ton code,
               ou adapte ce test en gardant ce qu'il vérifie : ne l'efface pas, ne le désactive
               pas (`skip`, `fixme`, `only`) et n'affaiblis pas ses assertions.
            6. Commit, puis pousse la branche.
            7. OUVRE une Pull Request vers `main` avec `gh pr create` : titre explicite, et corps
               en français décrivant le diagnostic et le correctif, terminé par une ligne
               « Fixes #${{ github.event.issue.number }} » pour lier et clore l'issue au merge.
            8. N'effectue AUCUNE action destructrice et ne fusionne pas : la PR doit rester en
               attente de revue humaine.

            RÈGLE IMPORTANTE — pas de @mention. N'écris JAMAIS « @ » suivi d'un identifiant
            (PR, commits, commentaires). Le rapport d'issue contient le pseudo CHAT de
            l'auteur (ex. « par toto ») : ce pseudo peut coïncider avec un vrai compte
            GitHub HORS de l'équipe, et un « @toto » le notifierait à tort. Référence
            l'auteur ou tout pseudo en texte brut, sans « @ ». Ne « tag » personne.
          # claude-code-action n'autorise par défaut que les outils natifs
          # (Read/Grep/Glob/Edit/Write) — PAS les commandes Bash. Or coder ici exige
          # un shell complet : git, gh, npm/npx, mais aussi inspecter (ls/cat/grep/find),
          # consulter les conteneurs (docker compose logs), etc. Une allowlist granulaire
          # faisait du whack-a-mole : chaque commande oubliée = un refus qui gâche un tour
          # et finit en « error_max_turns ». Ce workflow étant derrière le gate humain
          # « claude:fix » et tournant sur un runner de confiance, on autorise Bash
          # largement.
          # Pas de --max-turns : l'effort dépend trop de la feature/du code ; on laisse
          # Claude aller au bout, borné uniquement par le timeout-minutes du job.
          claude_args: |
            --model claude-opus-4-8
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash"

      # Rend lisible, dans les logs du job, le déroulé de Claude (messages + appels
      # d'outils + résultats + résultat final), à partir de l'execution_file exposé
      # par l'action. Remplace l'ancien show_full_output (JSON brut, issue #126).
      # Best-effort : le script sort toujours 0, donc ne casse jamais le job.
      - name: Transcription lisible de Claude
        if: always()
        run: .github/scripts/format-claude-log.sh "${{ steps.claude.outputs.execution_file }}"

      # Boucle CI : verdict, réparation, verdict… La CI de GitHub reste la référence,
      # car un test peut passer sur le runner et échouer sur ubuntu-latest (#440).
      # Une réparation qui ne pousse rien laisse le même SHA en échec : on s'arrête
      # là plutôt que de relancer Claude sur les mêmes logs. continue-on-error : une
      # réparation qui plante ne doit pas priver l'équipe de la notification finale.
      # La transcription suit chaque réparation, car l'action réécrit à chaque
      # exécution le même execution_file.
      - name: Attendre la CI de la PR
        id: ci1
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/wait-pr-ci.sh "${{ github.event.issue.number }}"

      - name: Réparer la CI (1re tentative)
        id: repair1
        if: steps.ci1.outputs.state == 'red'
        continue-on-error: true
        timeout-minutes: 30
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_BOT_TOKEN }}
          display_report: true
          prompt: ${{ env.CI_REPAIR_PROMPT }}
          claude_args: |
            --model claude-opus-4-8
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash"

      - name: Transcription de la 1re réparation
        if: always() && steps.repair1.outcome != 'skipped'
        run: .github/scripts/format-claude-log.sh "${{ steps.repair1.outputs.execution_file }}"

      - name: Attendre la CI après la 1re réparation
        id: ci2
        if: steps.ci1.outputs.state == 'red'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/wait-pr-ci.sh "${{ github.event.issue.number }}"

      - name: Réparer la CI (2e tentative)
        id: repair2
        if: steps.ci2.outputs.state == 'red' && steps.ci2.outputs.sha != steps.ci1.outputs.sha
        continue-on-error: true
        timeout-minutes: 30
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_BOT_TOKEN }}
          display_report: true
          prompt: ${{ env.CI_REPAIR_PROMPT }}
          claude_args: |
            --model claude-opus-4-8
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash"

      - name: Transcription de la 2e réparation
        if: always() && steps.repair2.outcome != 'skipped'
        run: .github/scripts/format-claude-log.sh "${{ steps.repair2.outputs.execution_file }}"

      - name: Attendre la CI après la 2e réparation
        id: ci3
        if: steps.ci2.outputs.state == 'red' && steps.ci2.outputs.sha != steps.ci1.outputs.sha
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/wait-pr-ci.sh "${{ github.event.issue.number }}"

      # Notifie l'équipe dans le chat MurgaChat une fois le verdict de la CI connu, et
      # le mentionne s'il n'est pas vert. Best-effort : n'échoue jamais le job (la PR
      # existe déjà). Requiert le secret SUPPORT_NOTIFY_TOKEN (partagé avec le serveur)
      # et, optionnellement, la variable CHAT_NOTIFY_URL (défaut http://localhost:4000,
      # joignable car runner local).
      - name: Notifier MurgaChat
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          NOTIFY_TOKEN: ${{ secrets.SUPPORT_NOTIFY_TOKEN }}
          CHAT_NOTIFY_URL: ${{ vars.CHAT_NOTIFY_URL || 'http://localhost:4000' }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          # Dernier verdict obtenu (une étape non exécutée donne une chaîne vide).
          CI_STATE: ${{ steps.ci3.outputs.state || steps.ci2.outputs.state || steps.ci1.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Cette étape ne doit JAMAIS faire échouer le job : quand elle tourne, le
          # travail utile est déjà fait (la PR est ouverte ou non, une notif ratée n'y
          # change rien). Or le shell est `bash -e` : la moindre commande en échec
          # sortait en 1 et marquait le job en échec — c'est ce qui a masqué la vraie
          # panne sur le run 33850091335. On coupe errexit, on teste explicitement
          # chaque appel, et on sort 0 quoi qu'il arrive.
          set +e
          if [ -z "$NOTIFY_TOKEN" ]; then echo "SUPPORT_NOTIFY_TOKEN absent → pas de notif"; exit 0; fi
          # On ne peut PAS filtrer sur un nom de branche fixe : claude-code-action
          # crée elle-même la branche (« claude/issue-<n>-<timestamp> »), pas le
          # « claude/fix-issue-<n> » demandé dans le prompt. On cherche donc la PR
          # ouverte dont la branche porte le numéro d'issue. Le motif `issue-<n>(-|$)`
          # matche aussi bien `claude/issue-91-2026…` que `claude/fix-issue-91`, sans
          # confondre #91 avec #910.
          PR_URL=$(gh pr list --repo "$REPO" --state open --json url,headRefName \
            --jq '[.[] | select(.headRefName | test("issue-'"$ISSUE"'(-|$)"))] | .[0].url // ""')
          RC=$?
          # Distinguer « l'appel a échoué » de « pas de PR » : sinon un token expiré se
          # déguise en « aucune PR trouvée » et la vraie panne reste invisible.
          if [ "$RC" -ne 0 ]; then
            echo "::warning::gh pr list a échoué (GH_BOT_TOKEN expiré ou révoqué ?) → pas de notif"
            exit 0
          fi
          if [ -z "$PR_URL" ]; then echo "Aucune PR ouverte trouvée → pas de notif"; exit 0; fi
          TITLE=$(gh issue view "$ISSUE" --repo "$REPO" --json title --jq '.title')
          # Le titre n'est qu'un libellé d'affichage : s'il manque, on notifie quand
          # même plutôt que d'abandonner une notif dont le lien PR, lui, est bon.
          [ -n "$TITLE" ] || TITLE="issue #$ISSUE"
          # Le texte du message est composé par le serveur : le titre est le seul champ
          # libre pour signaler une CI qui n'est pas verte, sans redéployer le serveur.
          case "$CI_STATE" in
            red)
              TITLE="⚠️ CI encore rouge après réparation automatique — $TITLE"
              gh pr comment "$PR_URL" --body "⚠️ La CI est encore rouge après les tentatives de réparation automatique de claude-fix : une intervention humaine est nécessaire. Détail des tentatives : $RUN_URL" \
                || echo "Commentaire de PR impossible (non bloquant)"
              ;;
            unknown) TITLE="⏳ CI sans verdict — $TITLE" ;;
          esac
          # Le serveur refuse un titre de plus de 300 caractères.
          TITLE="${TITLE:0:300}"
          PAYLOAD=$(jq -n --argjson n "$ISSUE" --arg u "$PR_URL" --arg t "$TITLE" \
            '{issueNumber:$n, prUrl:$u, title:$t}')
          if [ -z "$PAYLOAD" ]; then
            echo "::warning::payload JSON non construit (jq absent ?) → pas de notif"
            exit 0
          fi
          curl -fsS -X POST "$CHAT_NOTIFY_URL/support/notify" \
            -H "Authorization: Bearer $NOTIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            && echo "Chat notifié : $PR_URL" \
            || echo "Notif chat échouée (non bloquant)"
          exit 0

      # Les images rebâties par ce run rendent orphelines celles du run précédent :
      # on les libère dès maintenant plutôt qu'au prochain run (cf. le garde-fou
      # d'espace disque plus haut). Best-effort, n'échoue jamais le job.
      - name: Purge Docker post-run
        if: always()
        run: docker image prune -f || true
