name: desktop-installer

# Build des installeurs desktop (Windows NSIS, Linux .deb/.rpm/.AppImage), sans
# release, sans tag, sans APK : desktop-build.yml, les deux plateformes en parallèle.
#
#  - À la main (workflow_dispatch) : vérifier qu'une branche build (PR Dependabot
#    Tauri, changement dans web/src-tauri), ou reconstruire un installeur pour
#    remplacer à la main un asset d'une release existante. Les installeurs sont
#    en artefacts du run. La version vient des fichiers commités
#    (web/src-tauri/tauri.conf.json), e.g. Chat_0.5.5_x64-setup.exe.
#  - Sur main (push qui touche le Rust, et chaque vendredi) : garder chauds les
#    caches Rust et npm que lisent les builds des tags (release.yml). Un cache écrit
#    par un tag n'est lisible que par ce tag ; ceux de main le sont par tous. Le
#    vendredi : le lendemain des sorties de Rust stable (le jeudi), qui changent la
#    clé du cache, et avant que GitHub n'efface un cache resté 7 jours sans lecture.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Plateforme à construire"
        type: choice
        options: [all, windows, linux]
        default: all
  push:
    branches: [main]
    paths:
      - "web/src-tauri/**"
      - "web/package-lock.json"
      - ".github/workflows/desktop-build.yml"
      - ".github/workflows/desktop-installer.yml"
  schedule:
    - cron: "17 3 * * 5"

permissions:
  contents: read

jobs:
  desktop:
    uses: ./.github/workflows/desktop-build.yml
    with:
      platform: ${{ inputs.platform || 'all' }}
      artifacts: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
