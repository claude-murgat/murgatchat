# Keep the SHA-pinned GitHub Actions fresh: Dependabot opens a weekly PR bumping
# each `uses: …@<sha> # vX` to the latest release (SHA + comment). Without this,
# pinning to a commit would silently freeze actions and miss their security fixes.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days before adopting a newly published action release: a freshly cut
    # (or compromised) version shouldn't be auto-bumped on day zero.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

  # ── npm : les trois projets réellement déployés ────────────────────────────
  # (mobile/ et e2e/ sont volontairement hors périmètre : mobile est gelé depuis
  # le pivot PWA, e2e n'est que de l'outillage de test.)
  #
  # Les mises à jour MINEURES/PATCH sont GROUPÉES (une PR « prod » + une PR « dev »
  # par projet) pour éviter de noyer le dépôt sous les PR unitaires.
  #
  # Les MAJORS en sont volontairement exclus (`update-types`) : groupés, un seul
  # major cassant rendait toute la PR rouge et donc immergeable — c'est ce qui est
  # arrivé au premier lot (Express 5 + Prisma 7 + zod 4 dans une même PR). Hors
  # groupe, chaque major arrive en PR individuelle, relisible et testable seule.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      web-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      web-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript reste en 6.x. La 7.x est la réécriture native (port Go) : on
      # n'y va pas tant que notre outillage ne la couvre pas — et `latest` sur npm
      # pointe DÉJÀ sur la 7.x, donc sans ce garde-fou Dependabot la proposerait.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint reste en 9 CÔTÉ WEB : `eslint-plugin-react` plafonne sa peer dep à
      # `eslint@^9.7` et AUCUNE version publiée ne supporte la 10 — le blocage est
      # en amont, pas dans notre config. Sans ce garde-fou, Dependabot rouvre en
      # boucle des PR condamnées à échouer (ERESOLVE). À lever dès que
      # eslint-plugin-react publie le support d'ESLint 10.
      # NB : le serveur, lui, est passé en 10 — sa config n'utilise aucun plugin React.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      server-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      server-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Même garde-fou TS 7.x que pour /web (voir ci-dessus).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Mini-package de contrats partagés : sa seule dépendance est zod, mais elle est
  # dupliquée avec celle du serveur — il faut donc la suivre ici aussi pour ne pas
  # laisser les deux diverger.
  - package-ecosystem: "npm"
    directory: "/shared"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
