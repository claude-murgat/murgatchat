<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover : permet à l'app d'occuper toute la zone safe-area incluse,
      utile sur iPhone (notch) une fois installée en PWA et lancée depuis l'écran d'accueil.
      Le CSS utilise env(safe-area-inset-*) pour le padding.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <!-- Manifest (généré par vite-plugin-pwa au build). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Logo de l'onglet : un .ico avec un rendu par taille (16, 32, 48 px), le
         navigateur prend celui de l'écran. À 16 px le trait est un peu épaissi
         pour rester lisible ; la bulle est pleine (blanche) pour se voir aussi
         sur un onglet sombre. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />

    <!-- iOS standalone PWA : icône d'écran d'accueil + status bar transparente. -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Murgat Chat" />

    <!-- Couleur de la barre adresse Chrome Android + thème système. -->
    <meta name="theme-color" content="#3F0E40" />
    <!-- App is light-themed: force light rendering of native controls (no OS dark bleed). -->
    <meta name="color-scheme" content="light" />

    <!-- Détection iOS : un device-detection rapide pour l'install prompt
         (handler dans pwa.js / banner UI). -->
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Murgat Chat</title>
  </head>
  <body class="bg-aubergine-900 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
