[package]
name = "chat-desktop"
version = "0.7.4"
description = "Chat desktop wrapper (Tauri)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Toast Windows natif avec callback d'activation (clic → focus + deep-link), que
# tauri-plugin-notification ne fournit pas côté desktop. Déjà présent en dépendance
# transitive (via notify-rust en 0.7.2) ; on l'expose en direct pour main.rs.
tauri-winrt-notification = "0.7"
# Pour fixer l'AppUserModelID explicite du process (= app_id de la toast), sans
# quoi Windows ne route pas le callback d'activation du clic vers notre process.
# Aligné sur la version que tauri-winrt-notification tire déjà (0.61) → pas de doublon.
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
