[package]
name = "chat-desktop"
version = "1.6.21"
description = "Client du chat d'entreprise"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# API Windows natives (windows-rs) :
#  - UI_Notifications + Data_Xml_Dom : construire la toast « protocole » à la main
#    (le clic d'une toast ne peut PAS être reçu en in-process pour une app Win32
#    non-packagée → activation par protocole `murgatchat://…`, cf. main.rs) ;
#  - Win32_UI_Shell : SetCurrentProcessExplicitAppUserModelID (attribution de la toast) ;
#  - Win32_System_Registry + Win32_Security + Win32_System_Threading : can_self_update.
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "UI_Notifications",
    "Data_Xml_Dom",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Notifications freedesktop sur D-Bus (src/linux_notifications.rs). zbus est déjà
# dans l'arbre via tauri-plugin-notification (notify-rust) : même version, et les
# mêmes fonctionnalités que lui, plus l'API bloquante.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
panic = "abort"
# LTO « thin » et unités de compilation par défaut (16) plutôt que `lto = true` +
# `codegen-units = 1` : la passe LTO globale, sur un seul fil, était l'essentiel du
# build d'une release une fois les dépendances en cache. L'exécutable grossit un peu
# (c'est surtout un webview), sans effet notable sur l'appli.
lto = "thin"
opt-level = "s"
strip = true
